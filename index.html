<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كوكتيل الفعاليات الجماعية 🎲🎤</title>
    <!-- مكتبات MQTT و PeerJS للصوت المباشر -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --card-bg: rgba(30, 27, 75, 0.9);
            --primary: #6c5ce7;
            --accent: #fd79a8;
            --success: #00b894;
            --danger: #d63031;
            --warning: #fdcb6e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c20, #2d1b69, #1e1b4b, #130f40);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        h1 { color: #00cec9; font-size: 22px; margin-bottom: 10px; }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 25px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        input {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid var(--primary);
            text-align: center;
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.98); }

        .screen { display: none; }
        .active { display: block; }

        .mic-btn {
            background: #2d3436;
            margin-bottom: 10px;
        }
        .mic-btn.active-mic {
            background: var(--success);
        }

        .leaderboard-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            margin: 4px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 14px;
        }

        .player-row.me {
            border: 1px solid var(--accent);
            background: rgba(253, 121, 168, 0.2);
        }

        .q-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            background: var(--accent);
            margin-bottom: 8px;
        }

        .q-box {
            background: rgba(255,255,255,0.08);
            border-right: 4px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }

        .text-answer-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: auto;
            padding: 12px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, #00cec9, var(--primary));
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 99;
        }

        .side-chat {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(15, 12, 32, 0.98);
            border-right: 1px solid var(--primary);
            transition: left 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .side-chat.open { left: 0; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            word-break: break-word;
        }

        .chat-msg.me { background: var(--primary); align-self: flex-start; }
        .chat-msg.other { background: rgba(0, 206, 201, 0.3); align-self: flex-end; }
    </style>
</head>
<body>

    <button class="chat-toggle-btn" onclick="toggleChat()">💬 الشات</button>

    <div class="side-chat" id="side-chat">
        <div class="chat-header">
            <h4 style="margin:0; color:#00cec9;">دردشة الغرفة 💬</h4>
            <button onclick="toggleChat()" style="width:auto; padding:3px 10px; margin:0; background:var(--danger);">✕</button>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="chat-input" placeholder="اكتب رسالة..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()" style="width:auto; padding:8px 15px; margin:0;">إرسال</button>
        </div>
    </div>

    <div class="container">
        <h1>🎲 كوكتيل الفعاليات الجماعية 🎤</h1>

        <div id="login-screen" class="screen active">
            <input type="text" id="username" placeholder="اكتب اسمك هنا..." maxlength="15">
            <button onclick="saveName()">التالي 🚀</button>
        </div>

        <div id="room-screen" class="screen">
            <h3>مرحباً <span id="player-name-display" style="color:#ffeaa7;"></span>!</h3>
            <input type="number" id="room-code" placeholder="كود الغرفة (4 أرقام)" maxlength="4" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
            <button onclick="joinGameRoom()">دخول الغرفة 🔗</button>
            <p id="status-msg" style="color:#a29bfe; font-size:14px; margin-top:10px;"></p>
        </div>

        <div id="game-screen" class="screen">
            <button id="mic-btn" class="mic-btn" onclick="toggleMic()">🎙️ تشغيل المايك الجماعي</button>

            <div class="leaderboard-box" id="leaderboard"></div>

            <button id="roll-btn" onclick="rollTurn()">🎲 سحب فعالية جديدة!</button>

            <div id="turn-display" style="font-size:14px; color:#00cec9; margin:6px 0;">في انتظار سحب الفعالية...</div>

            <div id="activity-card" style="display:none;">
                <span class="q-type-badge" id="q-badge">فعالية</span>
                <div class="q-box" id="question-text"></div>

                <div class="options-grid" id="options-container" style="display:none;">
                    <button class="opt-btn" onclick="checkAnswer(0)"></button>
                    <button class="opt-btn" onclick="checkAnswer(1)"></button>
                    <button class="opt-btn" onclick="checkAnswer(2)"></button>
                    <button class="opt-btn" onclick="checkAnswer(3)"></button>
                </div>

                <div class="text-answer-group" id="text-input-container" style="display:none;">
                    <input type="text" id="text-answer-input" placeholder="اكتب الإجابة هنا..." maxlength="50">
                    <button onclick="checkTextAnswer()" style="width:auto; padding:8px 20px;">تأكيد 🎯</button>
                </div>
            </div>

            <div id="feedback-text" style="font-size:15px; font-weight:bold; margin:8px 0; min-height:20px;"></div>
        </div>
    </div>

    <!-- حاوية الأصوات المباشرة من باقي اللاعبين -->
    <div id="audio-container"></div>

    <script>
        function sanitize(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const eventsData = [
            { type: "تحدي الديسكورد 🤖", q: "ما هو البوت الخاص بإدارة الرتب والترحيب والشائعة استخدامه؟", options: ["ProBot", "Carl-bot", "Rythm", "Mee6"], correct: 0 },
            { type: "تحدي الديسكورد 👑", q: "ما هي الرتبة التي تملك كامل الصلاحيات في السيرفر؟", options: ["Moderator", "Administrator", "VIP", "Member"], correct: 1 },
            { type: "تحدي الديسكورد 💬", q: "ما هو الاختصار المستخدم لطرد عضو مؤقتاً بالديسكورد؟", options: ["/ban", "/timeout", "/kick", "/warn"], correct: 2 },
            { type: "ترتيب الجملة 🧩", q: "رتب الكلمات التالية: ( السيرفر / في / أهلاً / بكم )", mode: "text", correctText: "أهلا بكم في السيرفر" },
            { type: "ترتيب الجملة 🧩", q: "رتب الكلمات التالية: ( التحدي / اليوم / ينطلق / أقوى )", mode: "text", correctText: "ينطلق أقوى التحدي اليوم" },
            { type: "فك الجملة المعكوسة 🔄", q: "اقرأ الجملة واكتبها بالشكل الصحيح: 'رباطسإ سركيسد'", mode: "text", correctText: "إسباطر ديسكورد" },
            { type: "فك الجملة المعكوسة 🔄", q: "اكتب الجملة بالترتيب الصحيح: 'ديكوا طاشن'", mode: "text", correctText: "نشاط أكيد" }
        ];

        let client = null;
        let peer = null;
        let myId = Math.random().toString(36).substring(7);
        let roomTopic = "";
        let myName = "";
        let players = {};
        let currentEvent = null;
        let hasAnsweredCurrent = false;

        let localAudioStream = null;
        let isMicOn = false;

        function saveName() {
            const rawName = document.getElementById('username').value.trim();
            myName = sanitize(rawName);
            if(!myName) return alert("يرجى كتابة اسم صحيح!");
            document.getElementById('player-name-display').innerText = myName;
            showScreen('room-screen');
        }

        function joinGameRoom() {
            const code = document.getElementById('room-code').value.trim();
            if(code.length !== 4) return alert("أدخل كود 4 أرقام!");

            document.getElementById('status-msg').innerText = "جاري الاتصال بالنظام...";
            roomTopic = "ayoub_discord_room_" + code;

            // إعداد نظام الصوت (PeerJS)
            peer = new Peer(myId + "_" + code);

            peer.on('open', () => {
                // الاتصال بـ MQTT
                client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

                client.on('connect', () => {
                    client.subscribe(roomTopic);
                    showScreen('game-screen');

                    players[myId] = { name: myName, score: 0, peerId: peer.id };
                    updateUI();

                    broadcastData({ type: 'join', senderId: myId, name: myName, score: 0, peerId: peer.id });
                });

                client.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if(data.senderId !== myId) handleData(data);
                    } catch(e) {}
                });
            });

            // استقبال المكالمات الصوتية من اللاعبين الآخرين
            peer.on('call', (call) => {
                call.answer(localAudioStream);
                call.on('stream', (remoteStream) => {
                    addAudioStream(call.peer, remoteStream);
                });
            });
        }

        function broadcastData(data) {
            data.senderId = myId;
            if(client) client.publish(roomTopic, JSON.stringify(data));
        }

        function handleData(data) {
            const safeName = sanitize(data.name || data.senderName || '');
            
            if(data.type === 'join') {
                players[data.senderId] = { name: safeName, score: data.score, peerId: data.peerId };
                updateUI();
                appendChatMessage("النظام", `انضم ${safeName} للغرفة! 🎉`, 'other');
                broadcastData({ type: 'sync-player', senderId: myId, name: myName, score: players[myId].score, peerId: peer.id });
                
                // إذا كان المايك شغال اتصل بالعضو الجديد صوتياً
                if(isMicOn && localAudioStream && data.peerId) {
                    callPeer(data.peerId);
                }
            } 
            else if(data.type === 'sync-player') {
                players[data.senderId] = { name: safeName, score: data.score, peerId: data.peerId };
                updateUI();
            }
            else if(data.type === 'roll') {
                displayEvent(data.eIndex, safeName);
            } 
            else if(data.type === 'score-update') {
                if(players[data.senderId]) {
                    players[data.senderId].score = data.newScore;
                    updateUI();
                }
            } 
            else if(data.type === 'chat') {
                appendChatMessage(safeName, sanitize(data.text), 'other');
            }
        }

        // --- نظام المايك المطور عبر PeerJS ---
        async function toggleMic() {
            const btn = document.getElementById('mic-btn');

            if (!isMicOn) {
                try {
                    // طلب إذن المايك من المتصفح
                    localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    isMicOn = true;
                    btn.classList.add('active-mic');
                    btn.innerText = "🎙️ كتم المايك (شغال 🟢)";

                    // الاتصال صوتياً بجميع اللاعبين المتواجدين في الغرفة
                    Object.values(players).forEach(p => {
                        if(p.peerId && p.peerId !== peer.id) {
                            callPeer(p.peerId);
                        }
                    });

                } catch (err) {
                    alert("يرجى إعطاء صلاحية استخدام المايك في المتصفح ليشتغل الصوت!");
                }
            } else {
                // إيقاف المايك
                if (localAudioStream) {
                    localAudioStream.getAudioTracks().forEach(track => track.enabled = false);
                }
                isMicOn = false;
                btn.classList.remove('active-mic');
                btn.innerText = "🎙️ تشغيل المايك الجماعي";
            }
        }

        function callPeer(peerId) {
            if(!localAudioStream) return;
            const call = peer.call(peerId, localAudioStream);
            call.on('stream', (remoteStream) => {
                addAudioStream(peerId, remoteStream);
            });
        }

        function addAudioStream(id, stream) {
            let audio = document.getElementById("audio_" + id);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = "audio_" + id;
                audio.autoplay = true;
                document.getElementById('audio-container').appendChild(audio);
            }
            audio.srcObject = stream;
        }

        function rollTurn() {
            const eIndex = Math.floor(Math.random() * eventsData.length);
            displayEvent(eIndex, myName);
            broadcastData({ type: 'roll', eIndex: eIndex, name: myName });
        }

        function displayEvent(eIndex, starterName) {
            currentEvent = eventsData[eIndex];
            hasAnsweredCurrent = false;

            document.getElementById('turn-display').innerText = `🎲 الفعالية سحبها: ${starterName}`;
            document.getElementById('activity-card').style.display = 'block';
            document.getElementById('q-badge').innerText = currentEvent.type;
            document.getElementById('question-text').innerText = currentEvent.q;
            document.getElementById('feedback-text').innerText = "";

            const optGrid = document.getElementById('options-container');
            const textGroup = document.getElementById('text-input-container');

            optGrid.style.display = 'none';
            textGroup.style.display = 'none';

            if(currentEvent.mode === 'text') {
                textGroup.style.display = 'flex';
                document.getElementById('text-answer-input').value = '';
            } else {
                optGrid.style.display = 'grid';
                const optButtons = document.querySelectorAll('.opt-btn');
                currentEvent.options.forEach((opt, idx) => {
                    optButtons[idx].innerText = opt;
                    optButtons[idx].disabled = false;
                });
            }

            document.getElementById('roll-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex) {
            if(hasAnsweredCurrent) return;
            hasAnsweredCurrent = true;

            const isCorrect = (selectedIndex === currentEvent.correct);
            processResult(isCorrect, currentEvent.options[currentEvent.correct]);
        }

        function checkTextAnswer() {
            if(hasAnsweredCurrent) return;
            const userAns = sanitize(document.getElementById('text-answer-input').value.trim());
            if(!userAns) return;

            hasAnsweredCurrent = true;
            const isCorrect = userAns.toLowerCase() === currentEvent.correctText.toLowerCase();
            processResult(isCorrect, currentEvent.correctText);
        }

        function processResult(isCorrect, correctAnsText) {
            if(isCorrect) {
                players[myId].score += 1;
                showFeedback(`إجابة صحيحة ممتاز! 🎉`, true);
            } else {
                players[myId].score = Math.max(0, players[myId].score - 1);
                showFeedback(`خاطئة! ❌ الإجابة الصحيحة: (${correctAnsText})`, false);
            }

            updateUI();
            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            document.getElementById('roll-btn').style.display = 'block';

            broadcastData({ type: 'score-update', newScore: players[myId].score });
        }

        function toggleChat() {
            document.getElementById('side-chat').classList.toggle('open');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = sanitize(input.value.trim());
            if(!text) return;

            appendChatMessage('أنت', text, 'me');
            broadcastData({ type: 'chat', senderName: myName, text: text });
            input.value = '';
        }

        function handleChatKey(e) { if(e.key === 'Enter') sendChatMessage(); }

        function appendChatMessage(sender, text, type) {
            const box = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${type}`;
            msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function showFeedback(text, isCorrect) {
            const fb = document.getElementById('feedback-text');
            fb.innerText = text;
            fb.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
        }

        function updateUI() {
            const box = document.getElementById('leaderboard');
            box.innerHTML = '';

            const sorted = Object.keys(players)
                .map(id => ({ id, ...players[id] }))
                .sort((a, b) => b.score - a.score);

            sorted.forEach(p => {
                const row = document.createElement('div');
                row.className = `player-row ${p.id === myId ? 'me' : ''}`;
                row.innerHTML = `<span><b>${p.name}</b> ${p.id === myId ? '(أنت)' : ''}</span> <span><b>${p.score}</b> نقطة</span>`;
                box.appendChild(row);
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
