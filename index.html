<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة جداً ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Cairo', Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 400px;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #d63031;
            margin-bottom: 20px;
            font-size: 26px;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .heart-icon {
            font-size: 50px;
            animation: pulse 1s infinite alternate;
            margin-bottom: 15px;
            display: inline-block;
        }

        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .btn:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        /* أنيميشن نبض القلب */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* القلوب المتحركة في الخلفية */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">💖</div>
        <h1>إلى أصدق القلوب وأغلاها</h1>
        <p>مهما كتبت من كلمات، تعجز العبارات عن وصف مدى روعة وجودكِ. هذه المساحة البسيطة وُجدت لتكون رسالة حب وتقدير خافقة لكل لحظة جميلة تجمعنا.</p>
        <button class="btn" onclick="alert('أنتِ الأروع دائماً! ✨') اضغط هنا">اضغط هنا</button>
    </div>

    <!-- كود جافاسكريبت لتوليد القلوب المتحركة في الخلفية بشكل تلقائي -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = ['❤️', '💖', '✨', '🌹', '💫'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's'; // سرعة عشوائية
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 400);
    </script>

</body>
</html>
