<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال مهم جداً ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif, Tahoma;
        }

        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية الإيموجي المتحركة (قلوب وورود) */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 2;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            font-size: 50px;
            color: #ff3366;
            animation: pulse 1s infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        #yesBtn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .success-message {
            display: none;
            color: #ff3366;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            animation: bounce 0.8s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- حاوية الخلفية المتحركة -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="card" id="mainCard">
        <div class="heart">❤️</div>
        <h1>هل تقبلين أن تكوني الإنسانة الأغلى في حياتي وتوافقي تكوني حبيبتي؟ 🥰</h1>
        
        <div class="buttons" id="btnContainer">
            <button id="yesBtn" onclick="sayYes()">نعم، بكل سرور! ✨</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">لا 😢</button>
        </div>

        <div class="success-message" id="successText">
            كنت متأكداً أنك لن تقولي لا! أحبكِ جداً ❤️💍
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successText = document.getElementById('successText');
        const btnContainer = document.getElementById('btnContainer');
        const bgAnimation = document.getElementById('bgAnimation');

        // مصفوفة الإيموجي الخاصة بالورد والقلوب
        const emojis = ['❤️', '🌹', '💖', '💐', '🌸', '💕', '🌷', '💘'];

        // دالة لتوليد الإيموجي المتحركة باستمرار في الخلفية
        function createFloatingEmoji() {
            const emojiSpan = document.createElement('div');
            emojiSpan.classList.add('floating-emoji');
            
            // اختيار إيموجي عشوائي
            emojiSpan.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // مواقع وأحجام عشوائية
            emojiSpan.style.left = Math.random() * 100 + 'vw';
            emojiSpan.style.fontSize = (Math.random() * 20 + 18) + 'px';
            
            // سرعة حركة عشوائية
            const duration = Math.random() * 3 + 4; // ما بين 4 و 7 ثواني
            emojiSpan.style.animationDuration = duration + 's';

            bgAnimation.appendChild(emojiSpan);

            // إزالة الإيموجي بعد انتهاء الأنيميشن لتخفيف الحمل عن المتصفح
            setTimeout(() => {
                emojiSpan.remove();
            }, duration * 1000);
        }

        // توليد إيموجي كل 300 جزء من الثانية
        setInterval(createFloatingEmoji, 300);

        // دالة زر "لا" الهارب
        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(20, x)}px`;
            noBtn.style.top = `${Math.max(20, y)}px`;
        }

        // دالة زر "نعم"
        function sayYes() {
            btnContainer.style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.heart').style.fontSize = '80px';
            successText.style.display = 'block';
        }
    </script>

</body>
</html>
