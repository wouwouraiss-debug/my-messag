<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كوكتال علي - هضرة وأغاني</title>
    <style>
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 70%;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            object-fit: cover;
            filter: brightness(0.6) contrast(1.1);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 420px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1;
        }

        .chat-header {
            background: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 14px;
            color: #ffc107;
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            max-height: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .person1 {
            background: #0056b3;
            align-self: flex-start;
        }

        .person2 {
            background: #28a745;
            align-self: flex-end;
        }

        .audio-snippet {
            margin-top: 5px;
            width: 100%;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #2a2a2a;
            color: #fff;
        }

        button {
            padding: 10px 12px;
            border: none;
            background: #ffc107;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="YOUR_VIDEO_LINK.mp4" type="video/mp4">
        متصفحك لا يدعم عرض الفيديو.
    </video>

    <div class="chat-container">
        <div class="chat-header">
            <span id="turnIndicator">دور: الطرف الأول</span>
            <span class="timer" id="timerDisplay">20s</span>
        </div>
        
        <div class="chat-messages" id="messageBox"></div>
        
        <div class="chat-input-area">
            <input type="text5" id="userInput" placeholder="اكتب هضرة أو مقطع قصير...">
            <button onclick="sendMessage()">إرسال</button>
            <button onclick="skipTurn()" style="background: #dc3545; color: #fff;" title="إذا غلطت أو حبست، دوز للآخر">تخطى / غلط</button>
        </div>
    </div>

    <script>
        let currentTurn = 1;
        let timeLeft = 20;
        let countdown;

        function startTimer() {
            clearInterval(countdown);
            timeLeft = 20;
            document.getElementById('timerDisplay').innerText = timeLeft + "s";

            countdown = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    // إلا فوت الوقت وماجاوبش، يتقلب الدور وحدو باش ما يبقاش حاصل
                    switchTurn();
                    alert("فوتك الوقت! تم تحويل الدور للطرف الآخر تلقائياً.");
                }
            }, 1000);
        }

        function switchTurn() {
            if (currentTurn === 1) {
                currentTurn = 2;
                document.getElementById('turnIndicator').innerText = "دور: الطرف الثاني";
            } else {
                currentTurn = 1;
                document.getElementById('turnIndicator').innerText = "دور: الطرف الأول";
            }
            startTimer();
        }

        function skipTurn() {
            switchTurn();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messageBox = document.getElementById('messageBox');
            
            if (input.value.trim() === "") return;

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (currentTurn === 1) {
                messageDiv.classList.add('person1');
                messageDiv.innerHTML = `<strong>الطرف الأول:</strong> ${input.value}`;
                currentTurn = 2;
                document.getElementById('turnIndicator').innerText = "دور: الطرف الثاني";
            } else {
                messageDiv.classList.add('person2');
                messageDiv.innerHTML = `<strong>الطرف الثاني:</strong> ${input.value}`;
                currentTurn = 1;
                document.getElementById('turnIndicator').innerText = "دور: الطرف الأول";
            }

            messageBox.appendChild(messageDiv);
            input.value = "";
            messageBox.scrollTop = messageBox.scrollHeight;
            startTimer(); // إعادة ضبط الوقت للدور الجديد
        }

        // نبدأ المؤقت مع بداية الصفحة
        startTimer();
    </script>

</body>
</html>
