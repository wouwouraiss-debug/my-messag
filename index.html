<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الفعاليات أونلاين 🎲💬</title>
    <!-- مكتبة WebSocket MQTT المباشرة -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg: #0f0c20;
            --card: #1e1b4b;
            --primary: #6c5ce7;
            --accent: #fd79a8;
            --success: #00b894;
            --danger: #d63031;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2d1b69, var(--bg));
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            direction: rtl;
        }

        .container {
            background: rgba(30, 27, 75, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { color: #00cec9; font-size: 22px; margin-bottom: 15px; }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 25px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        input {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: 1px solid var(--primary);
            text-align: center;
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.98); }

        .screen { display: none; }
        .active { display: block; }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .p-card { flex: 1; padding: 5px; }
        .score { font-size: 24px; color: #ffeaa7; font-weight: bold; }

        .q-box {
            background: rgba(255,255,255,0.08);
            border-right: 4px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
        }

        .turn-box { font-size: 18px; color: #00cec9; font-weight: bold; margin: 8px 0; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .opt-btn:hover { background: var(--primary); }
        .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .feedback-msg {
            font-size: 15px;
            font-weight: bold;
            margin: 8px 0;
            min-height: 20px;
        }

        .chat-section {
            margin-top: 15px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 10px;
        }

        .chat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 120px;
            overflow-y: auto;
            padding: 8px;
            text-align: right;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 8px;
            width: fit-content;
            max-width: 80%;
            word-break: break-word;
        }

        .chat-msg.me { background: var(--primary); align-self: flex-start; }
        .chat-msg.other { background: rgba(0, 206, 201, 0.3); align-self: flex-end; }

        .chat-input-group {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .chat-input-group input { flex: 1; margin: 0; text-align: right; padding: 8px 15px; }
        .chat-input-group button { width: auto; padding: 8px 18px; margin: 0; border-radius: 20px; }
        
        .room-choice-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 مسابقة الفعاليات + الشات 💬</h1>

        <div id="login-screen" class="screen active">
            <input type="text" id="username" placeholder="اكتب اسمك هنا...">
            <button onclick="saveName()">التالي 🚀</button>
        </div>

        <div id="room-screen" class="screen">
            <h3>مرحباً <span id="player-name-display" style="color:#ffeaa7;"></span>!</h3>
            <p style="font-size: 14px; color: #ccc;">أدخل كود الغرفة (4 أرقام) للدخول مع صاحبك</p>

            <div class="room-choice-box">
                <input type="number" id="room-code" placeholder="أدخل كود الغرفة (4 أرقام)" maxlength="4" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
                <button onclick="joinGameRoom()">دخول الغرفة 🔗</button>
            </div>
            <p id="status-msg" style="color:#a29bfe; font-size:14px; margin-top:10px;"></p>
        </div>

        <div id="game-screen" class="screen">
            <div class="scoreboard">
                <div class="p-card">
                    <div id="p1-title">أنت</div>
                    <div class="score" id="p1-score">0</div>
                </div>
                <div class="p-card">
                    <div id="p2-title">المنافس</div>
                    <div class="score" id="p2-score">0</div>
                </div>
            </div>

            <button id="roll-btn" onclick="rollTurn()">🎲 سحب القرعة والسؤال!</button>

            <div class="turn-box" id="turn-display">في انتظار دخول اللاعب الثاني...</div>
            <div class="q-box" id="question-text">اضغط على الزر الفوقاني باش تسحب سؤال!</div>

            <div class="options-grid" id="options-container" style="display:none;">
                <button class="opt-btn" onclick="checkAnswer(0)"></button>
                <button class="opt-btn" onclick="checkAnswer(1)"></button>
                <button class="opt-btn" onclick="checkAnswer(2)"></button>
                <button class="opt-btn" onclick="checkAnswer(3)"></button>
            </div>

            <div class="feedback-msg" id="feedback-text"></div>

            <div class="chat-section">
                <div class="chat-box" id="chat-box">
                    <small style="color: #aaa; text-align: center;">بداية المحادثة...</small>
                </div>
                <div class="chat-input-group">
                    <input type="text" id="chat-input" placeholder="اكتب رسالة..." onkeypress="handleChatKey(event)">
                    <button onclick="sendChatMessage()">إرسال 📩</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "ما هو الحيوان الذي لا ينام منذ ولادته حتى موته؟", options: ["القرش", "الضفدع الثوري", "النملة", "الظبي"], correct: 1 },
            { q: "ما هو أصغر كوكب في المجموعة الشمسية؟", options: ["المريخ", "عطارد", "الزهرة", "بلوتو"], correct: 1 },
            { q: "كم قلبًا يوجد لدى الأخطبوط؟", options: ["قلب واحد", "قلبان", "3 قلوب", "4 قلوب"], correct: 2 },
            { q: "شيء كلما أخذت منه كبر؟", options: ["الحفرة", "العمر", "المال", "العلم"], correct: 0 },
            { q: "ما هي العاصمة التي يطلق عليها مدينة النور؟", options: ["لندن", "باريس", "روما", "مدريد"], correct: 1 },
            { q: "شيء يملك أسناناً ولكنه لا يعض؟", options: ["المشط", "المنشار", "الزيبار", "القرش"], correct: 0 }
        ];

        let client = null;
        let myId = Math.random().toString(36).substring(7); // معرف فريد للجهاز
        let roomTopic = "";
        let myName = "";
        let otherName = "المنافس";
        let myScore = 0;
        let otherScore = 0;
        let currentQuestion = null;
        let isMyTurn = false;

        function saveName() {
            myName = document.getElementById('username').value.trim();
            if(!myName) return alert("يرجى كتابة اسمك أولاً!");

            document.getElementById('player-name-display').innerText = myName;
            showScreen('room-screen');
        }

        function joinGameRoom() {
            const code = document.getElementById('room-code').value.trim();
            if(code.length !== 4) return alert("يرجى كتابة كود مكون من 4 أرقام بالضبط!");

            document.getElementById('status-msg').innerText = "جاري الاتصال بالسيرفر السريع...";
            roomTopic = "ayoub_quiz_room_" + code;

            // استخدام سيرفر WebSocket مجاني وسريع جداً مخصص للألعاب
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            client.on('connect', () => {
                document.getElementById('status-msg').innerText = "تم الاتصال! في انتظار المنافس...";
                client.subscribe(roomTopic);
                
                showScreen('game-screen');
                updateUI();

                // الترحيب والمزامنة مع المنافس
                broadcastData({ type: 'join', senderId: myId, name: myName });
            });

            client.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                if(data.senderId !== myId) {
                    handleData(data);
                }
            });
        }

        function broadcastData(data) {
            data.senderId = myId;
            if(client) {
                client.publish(roomTopic, JSON.stringify(data));
            }
        }

        function handleData(data) {
            if(data.type === 'join') {
                otherName = data.name;
                updateUI();
                document.getElementById('turn-display').innerText = `تم اتصال ${otherName}! اسحب السؤال للبدء 🎉`;
                // نرد عليه باسمنا باش يعرفنا
                broadcastData({ type: 'welcome-back', name: myName });
            } else if(data.type === 'welcome-back') {
                otherName = data.name;
                updateUI();
                document.getElementById('turn-display').innerText = `جاهز للعب مع ${otherName}! 🎉`;
            } else if(data.type === 'roll') {
                displayQuestion(data.turnIsP1, data.qIndex);
            } else if(data.type === 'answer-result') {
                otherScore = data.newScore;
                updateUI();
                showFeedback(data.msg, data.isCorrect);
            } else if(data.type === 'chat') {
                appendChatMessage(otherName, data.text, 'other');
            }
        }

        function rollTurn() {
            const isMe = Math.random() < 0.5;
            const qIndex = Math.floor(Math.random() * quizData.length);

            displayQuestion(isMe, qIndex);

            broadcastData({
                type: 'roll',
                turnIsP1: !isMe,
                qIndex: qIndex
            });
        }

        function displayQuestion(isItMe, qIndex) {
            isMyTurn = isItMe;
            currentQuestion = quizData[qIndex];
            
            document.getElementById('turn-display').innerText = isItMe ? `🎲 الدور عليك يا: ${myName}!` : `🎲 الدور على: ${otherName}`;
            document.getElementById('question-text').innerText = currentQuestion.q;
            document.getElementById('feedback-text').innerText = "";

            const optButtons = document.querySelectorAll('.opt-btn');
            const optionsGrid = document.getElementById('options-container');
            
            optionsGrid.style.display = 'grid';

            currentQuestion.options.forEach((opt, idx) => {
                optButtons[idx].innerText = opt;
                optButtons[idx].disabled = !isItMe;
            });

            document.getElementById('roll-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex) {
            if(!isMyTurn) return;

            const isCorrect = (selectedIndex === currentQuestion.correct);
            
            if(isCorrect) {
                myScore += 1;
                showFeedback("إجابة صحيحة! 🎉 (+1 نقطة)", true);
            } else {
                myScore -= 1;
                showFeedback(`إجابة خاطئة! ❌ (-1 نقطة) - الصحيحة: ${currentQuestion.options[currentQuestion.correct]}`, false);
            }

            updateUI();

            document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
            document.getElementById('roll-btn').style.display = 'block';

            broadcastData({
                type: 'answer-result',
                newScore: myScore,
                isCorrect: isCorrect,
                msg: isCorrect ? `جاوب ${myName} إجابة صحيحة! ✅` : `غلط ${myName} في الإجابة! ❌`
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            appendChatMessage('أنت', text, 'me');

            broadcastData({
                type: 'chat',
                text: text
            });

            input.value = '';
        }

        function handleChatKey(e) {
            if(e.key === 'Enter') sendChatMessage();
        }

        function appendChatMessage(sender, text, type) {
            const box = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${type}`;
            msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function showFeedback(text, isCorrect) {
            const fb = document.getElementById('feedback-text');
            fb.innerText = text;
            fb.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
        }

        function updateUI() {
            document.getElementById('p1-title').innerText = `${myName} (أنت)`;
            document.getElementById('p2-title').innerText = otherName;
            document.getElementById('p1-score').innerText = myScore;
            document.getElementById('p2-score').innerText = otherScore;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
