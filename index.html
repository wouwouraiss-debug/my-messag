<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الفعاليات أونلاين 🎲</title>
    <!-- مكتبة PeerJS للربط المباشر P2P أونلاين -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f0c20;
            --card: #1e1b4b;
            --primary: #6c5ce7;
            --accent: #fd79a8;
            --success: #00b894;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2d1b69, var(--bg));
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            direction: rtl;
        }

        .container {
            background: rgba(30, 27, 75, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { color: #00cec9; font-size: 24px; margin-bottom: 20px; }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: 1px solid var(--primary);
            text-align: center;
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.98); }

        .screen { display: none; }
        .active { display: block; }

        .my-id-box {
            background: rgba(0, 206, 201, 0.1);
            border: 1px dashed #00cec9;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            word-break: break-all;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .p-card { flex: 1; padding: 5px; }
        .score { font-size: 24px; color: #ffeaa7; font-weight: bold; }

        .q-box {
            background: rgba(255,255,255,0.08);
            border-right: 4px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .turn-box { font-size: 20px; color: #00cec9; font-weight: bold; margin: 10px 0; }
        .btn-success { background: var(--success); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 مسابقة الفعاليات أونلاين</h1>

        <!-- شاشة تسجيل الاسم -->
        <div id="login-screen" class="screen active">
            <input type="text" id="username" placeholder="اكتب اسمك هنا...">
            <button onclick="initPlayer()">دخول اللعبة 🚀</button>
        </div>

        <!-- شاشة الربط بين الأجهزة -->
        <div id="connect-screen" class="screen">
            <h3>مرحباً <span id="player-name-display" style="color:#ffeaa7;"></span>!</h3>
            
            <div class="my-id-box">
                <small>رمز الجهاز تاعك (ابعثوا لصاحبك):</small><br>
                <b id="my-peer-id" style="font-size: 18px; color:#00cec9;">جاري التجهيز...</b>
            </div>

            <hr style="opacity: 0.2; margin: 20px 0;">

            <input type="text" id="other-peer-id" placeholder="أدخل رمز جهاز صاحبك...">
            <button onclick="connectToPeer()">اتصال وتوصيل الأجهزة 🔗</button>
            <p id="status-msg" style="color:#a29bfe; font-size:14px;"></p>
        </div>

        <!-- شاشة اللعب -->
        <div id="game-screen" class="screen">
            <div class="scoreboard">
                <div class="p-card">
                    <div id="p1-title">أنت</div>
                    <div class="score" id="p1-score">0</div>
                </div>
                <div class="p-card">
                    <div id="p2-title">المنافس</div>
                    <div class="score" id="p2-score">0</div>
                </div>
            </div>

            <button onclick="rollTurn()">🎲 سحب القرعة والسؤال!</button>

            <div class="turn-box" id="turn-display">في انتظار السحب...</div>
            <div class="q-box" id="question-text">اضغط على الزر للسحب لك ولصاحبك بنفس اللحظة!</div>

            <button class="btn-success" id="add-point-btn" style="display:none;" onclick="addScore()">إجابة صحيحة (+1 نقطة) ✅</button>
        </div>
    </div>

    <script>
        // قائمة الأسئلة والفعاليات
        const questions = [
            "ما هو الحيوان الذي لا ينام منذ ولادته؟",
            "شيء كلما أخذت منه كبر؟",
            "تحدي: قل ثلاث كلمات سريعة بدون خطأ!",
            "ما هي العاصمة التي يطلق عليها مدينة النور؟",
            "سؤال صراحة: ما هي أكره عادة عند منافسك؟",
            "تحدي: قم بتقليد صوت حيوان يختاره منافسك!",
            "ما هو أصغر كوكب في المجموعة الشمسية؟",
            "شيء يملك أسناناً ولكنه لا يعض؟",
            "تحدي: اذكر 5 أشياء باللون الأزرق حولك خلال 10 ثواني!",
            "كم قلبًا يوجد لدى الأخطبوط؟",
            "سؤال صراحة: لو أُتيحت لك فرصة لتغيير شيء واحد في حياتك، ماذا سيكون؟",
            "تحدي: حاول عدم الضحك لمدة 30 ثانية أمام المنافس!"
        ];

        let peer = null;
        let conn = null;
        let myName = "";
        let otherName = "المنافس";
        let myScore = 0;
        let otherScore = 0;

        function initPlayer() {
            myName = document.getElementById('username').value.trim();
            if(!myName) return alert("يرجى كتابة اسمك أولاً!");

            document.getElementById('player-name-display').innerText = myName;

            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
                showScreen('connect-screen');
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function connectToPeer() {
            const destId = document.getElementById('other-peer-id').value.trim();
            if(!destId) return alert("أدخل رمز جهاز صاحبك!");

            document.getElementById('status-msg').innerText = "جاري الاتصال...";
            conn = peer.connect(destId);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'init', name: myName });
                showScreen('game-screen');
                updateUI();
            });

            conn.on('data', (data) => {
                handleData(data);
            });
        }

        function handleData(data) {
            if(data.type === 'init') {
                otherName = data.name;
                showScreen('game-screen');
                updateUI();
            } else if(data.type === 'roll') {
                displayRollResult(data.turnIsP1, data.qIndex);
            } else if(data.type === 'add-score') {
                otherScore++;
                updateUI();
            }
        }

        function rollTurn() {
            const isMe = Math.random() < 0.5;
            const qIndex = Math.floor(Math.random() * questions.length);

            displayRollResult(isMe, qIndex);

            if(conn) {
                conn.send({
                    type: 'roll',
                    turnIsP1: !isMe,
                    qIndex: qIndex
                });
            }
        }

        function displayRollResult(isItMe, qIndex) {
            const turnText = isItMe ? `🎲 الدور عليك يا: ${myName}!` : `🎲 الدور على: ${otherName}`;
            
            document.getElementById('turn-display').innerText = turnText;
            document.getElementById('question-text').innerText = questions[qIndex];
            document.getElementById('add-point-btn').style.display = isItMe ? 'block' : 'none';
        }

        function addScore() {
            myScore++;
            updateUI();
            document.getElementById('add-point-btn').style.display = 'none';

            if(conn) {
                conn.send({ type: 'add-score' });
            }
        }

        function updateUI() {
            document.getElementById('p1-title').innerText = `${myName} (أنت)`;
            document.getElementById('p2-title').innerText = otherName;
            document.getElementById('p1-score').innerText = myScore;
            document.getElementById('p2-score').innerText = otherScore;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
