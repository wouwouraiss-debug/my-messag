<head>
<meta charset="UTF-8">

<style>

margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;
/* دمج الصورة اللي أرسلتها مباشرة داخل الكود */

    linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),

background-size: cover;
background-position: center;
font-family: 'Cairo', sans-serif;
color: white;
display: flex;
align-items: center;
justify-content: center;
}

.box{
text-align:center;
z-index:2;
animation:show 2s;
padding: 20px;
}

@keyframes show{
from{opacity:0;transform:scale(.5);}
to{opacity:1;transform:scale(1);}
}

#count{
font-size:90px;
color:#ff94b8;
text-shadow: 0 0 20px rgba(255, 148, 184, 0.6);
}

.star{
font-size:100px;
cursor:pointer;
animation:float 2s infinite;
filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
}

@keyframes float{
50%{transform:translateY(-20px);}
}

.heart{
font-size:120px;
animation:beat 1s infinite;
filter:drop-shadow(0 0 30px #ff3b7a);
}

@keyframes beat{
50%{transform:scale(1.2);}
}

.name{
font-size:38px;
color:#ff94b8;
text-shadow:0 0 25px rgba(255, 148, 184, 0.8);
margin-top: 10px;
}

.text{
font-size:20px;
line-height:2.2;
margin-top:20px;
text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

button{
margin-top:30px;
padding:15px 35px;
border:0;
border-radius:30px;
background:#ff3b7a;
color:white;
font-size:18px;
cursor:pointer;
box-shadow: 0 5px 20px rgba(255, 59, 122, 0.5);
transition: 0.3s;
font-family: 'Cairo', sans-serif;
}

button:hover {
transform: scale(1.05);
background: #ff528b;
}

.fly{
position:absolute;
animation:up 4s linear;
}

@keyframes up{
to{
transform:translateY(-100vh);
opacity:0;
}
}

.final{
text-align:center;
animation:show 3s;
padding: 20px;
}

.final p{
font-size:22px;
line-height:2.3;
text-shadow: 0 2px 6px rgba(0,0,0,0.9);
}

</style>
</head>

<body>

<div id="app" class="box">
<h2>اصبري كاين سر صغير يستنى فيك تحت النجوم ✨</h2>
<div id="count">3</div>
</div>


<script>
// العد التنازلي
let n=3;

let timer=setInterval(()=>{

n--;
document.getElementById("count").innerHTML=n;

if(n==0){

clearInterval(timer);

app.innerHTML=`
<div class="star" onclick="firstGift()">⭐</div>
<p style="text-shadow: 0 2px 5px rgba(0,0,0,0.9); font-size: 20px; margin-top: 15px;">المفتاح راه هنا... اضغطي على النجمة</p>
`;

}

},1000);


// المفاجأة الأولى
function firstGift(){

app.innerHTML=`

<div class="heart">❤️</div>

<div class="name">
يا أجمل صدفة في حياتي ✨
</div>

<div class="text">
والله العظيم غير كي تدخل للدنيا وتلقى شخص يغيرلك طابع أيامك، تحس بلي الدنيا مزال فيها الخير.<br>
نهار شفتك، ما كنتش نعرف بلي هذاك النهار راح يكون نقطة تحول وينسيني في كل تعب عدى عليا ❤️
</div>


<button onclick="secondGift()">
كملي اقراي... 💌
</button>

`;

}



// المفاجأة الثانية
function secondGift(){

document.body.innerHTML=`

<div class="final">

<div style="font-size: 70px; margin-bottom: 15px;">❤️✨</div>

<p>
إذا قبلتِ تكوني شريكة عمري ومرتي وحبيبتي... ❤️<br><br>

نعدك بلي نبقى ديما السند اللي تميلي عليه كي تغلبك الدنيا،<br>
والنور اللي يضوي عتمة أيامك، والضحكة اللي ما تفارقش وجهك خلاص ✨<br><br>

هذه غير البداية، وبيناتنا عمر كامل مكتوب بالهنا والحب الصافي 💙
</p>

</div>

`;


// قلوب طايرة
for(let i=0;i<100;i++){

let h=document.createElement("div");

h.className="fly";
h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";
h.style.top="100%";
h.style.fontSize=Math.random()*25+15+"px";

document.body.appendChild(h);

}

}

</script>

</body>
</html>
